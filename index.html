<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twin Shores Capital</title>
    <style>
        /* This centers everything on the screen */
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        /* Placeholder for your logo */
        .logo-placeholder {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            /* Remove the border/background once you have a real logo image */
            border: 1px dashed #ccc;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 0.8rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .contact-line {
            font-size: 1rem;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        a {
            color: #004a7c;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Twin Shores Logo 1 (4.14.26).jpg" alt="Twin Shores Capital Logo" style="width: 150px; margin-bottom: 20px;">LOGO SPACE</div>
        
        <h1>Twin Shores Capital</h1>
        
        <p class="contact-line">
            Reach out to <a href="mailto:inquiries@twinshorescapital.com">inquiries@twinshorescapital.com</a> to learn more.
        </p>
    </div>

</body>
</html>
