<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twin Shores Capital</title>
    <style>
        /* Centering the content vertically and horizontally */
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
        }

        /* Adjust the logo size here */
        .logo {
            width: 500px; /* You can change this to make the logo larger or smaller */
            height: auto;
            margin-bottom: 40px;
        }

        .contact-line {
            font-size: 1rem;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 25px;
            letter-spacing: 0.5px;
        }

        a {
            color: #004a7c;
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Logo1.jpeg" alt="Twin Shores Capital Logo" class="logo">
        
        <p class="contact-line">
            Reach out to <a href="mailto:inquiries@twinshorescapital.com">inquiries@twinshorescapital.com</a> to learn more.
        </p>
    </div>

</body>
</html>
